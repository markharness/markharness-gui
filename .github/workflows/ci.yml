name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: windows (frontend and rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit,cargo-about

      # The contract test runs the real markharness, built from the commit of the
      # core's GUI development branch pinned in .github/markharness-rev. No core
      # release contains `traceability` or `gui` yet.
      - name: Cache the pinned markharness
        id: markharness-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/markharness
          key: markharness-${{ runner.os }}-${{ hashFiles('.github/markharness-rev') }}

      - name: Build the pinned markharness
        if: steps.markharness-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $rev = (Get-Content .github/markharness-rev).Trim()
          cargo install --git https://github.com/markharness/markharness --rev $rev --locked --root "$env:RUNNER_TEMP/markharness" markharness

      - name: Point the contract test at it
        shell: pwsh
        run: |
          "MARKHARNESS_BIN=$env:RUNNER_TEMP/markharness/bin/markharness.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - run: npm ci
      - run: npm run notices:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # The Rust build embeds the built frontend, so the frontend is built first.
      - run: npm run build
      - run: npm audit

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: cargo-deny (Windows x64)
        run: cargo deny --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc check licenses sources bans
      - name: cargo-deny (macOS arm64)
        run: cargo deny --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin check licenses sources bans
      - run: cargo audit --file src-tauri/Cargo.lock
