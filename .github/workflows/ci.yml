name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: windows (frontend and rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit,cargo-about

      # The contract test runs the real markharness. The version is pinned in
      # .github/markharness-version, and the download is checked against the
      # release's SHA256SUMS.
      - name: Install the pinned markharness
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content .github/markharness-version).Trim()
          $dir = Join-Path $env:RUNNER_TEMP "mh"
          $zip = "markharness-$v-x86_64-pc-windows-msvc.zip"
          gh release download "v$v" -R markharness/markharness -p $zip -p SHA256SUMS -D $dir
          $expected = (Select-String -Path "$dir/SHA256SUMS" -Pattern ([regex]::Escape($zip))).Line.Split(' ')[0]
          $actual = (Get-FileHash "$dir/$zip" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "checksum mismatch for $zip" }
          Expand-Archive "$dir/$zip" -DestinationPath $dir
          "MARKHARNESS_BIN=$dir/markharness-$v-x86_64-pc-windows-msvc/markharness.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - run: npm ci
      - run: npm run notices:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # The Rust build embeds the built frontend, so the frontend is built first.
      - run: npm run build
      - run: npm audit

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: cargo-deny (Windows x64)
        run: cargo deny --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc check licenses sources bans
      - name: cargo-deny (macOS arm64)
        run: cargo deny --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin check licenses sources bans
      - run: cargo audit --file src-tauri/Cargo.lock
